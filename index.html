<!DOCTYPE html>
<html>
    <head>
        <title>fanfic data</title>
        <link rel="stylesheet" href="style.css">
    </head>

    <body>

        <div id=months-chart>
          <canvas id="monthsChart"></canvas>
        </div>

        <div id=fandoms-chart>
          <canvas id="fandomsChart" width="3000" height="150"></canvas>
        </div>
        
        <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
        
        <script>
        const ctx = document.getElementById('monthsChart');
          
          fetch("months.json")
            .then(response => response.json())
            .then(months => {
            const labels = Object.keys(months);
            const values = Object.values(months);
          
            new Chart(ctx, {
              type: 'bar',
              data: {
                labels: labels,
                datasets: [{
                  label: '# read',
                  data: values,
                  borderWidth: 1
                }]
              },
              options: {
                scales: {
                  y: {
                    beginAtZero: true
                  }
                }
              }
            });
          });
        </script>

        <script>
        const ctx2 = document.getElementById('fandomsChart');
          
          fetch("fandoms.json")
            .then(response => response.json())
            .then(fandoms => {
            const labels = Object.keys(fandoms);
            const values = Object.values(fandoms);
          
            new Chart(ctx2, {
              type: 'bar',
              data: {
                labels: labels,
                datasets: [{
                  label: 'fandoms',
                  data: values,
                  borderWidth: 1
                }]
              },
              options: {
                responsive: false,
                scales: {
                  y: {
                    beginAtZero: true
                  }
                }
              }
            });
          });
        </script>

    </body>
  
</html>
